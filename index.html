<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  보안 정책(CSP): 아래 'sha256-…' 값은 이 파일 아래쪽 스크립트 블록 내용과 정확히 일치해야 합니다.
  스크립트를 고치면 페이지가 멈출 수 있어요. 그럴 땐 브라우저 개발자 도구 콘솔에 표시되는
  새 해시('sha256-…')로 바꾸거나, 이 meta 한 줄을 지우면 됩니다.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-AdTaL+m4wBbTxQH2mp4IQH2cqFA4h6b387GMC+vj4tY=' https://accounts.google.com/gsi/client https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; connect-src https://script.google.com https://script.googleusercontent.com https://www.googleapis.com https://accounts.google.com/gsi/ https://dapi.kakao.com https://openlibrary.org; frame-src https://accounts.google.com/gsi/; img-src 'self' data: blob: https:; font-src data:; object-src 'none'; base-uri 'none'">
<title>플래너</title>
<style>
/* 서체: Apple SD Gothic Neo(산돌고딕). 인터넷에 올리는 파일이라 서체 파일은 넣지 않고 기기에 있는 서체를 써요 (맥·아이폰은 그대로, 윈도는 맑은 고딕). */
@font-face{font-family:SDG;font-weight:400;font-style:normal;font-display:swap;src:local("Apple SD Gothic Neo Regular"),local("AppleSDGothicNeo-Regular")}
@font-face{font-family:SDG;font-weight:600;font-style:normal;font-display:swap;src:local("Apple SD Gothic Neo SemiBold"),local("AppleSDGothicNeo-SemiBold")}
@font-face{font-family:SDG;font-weight:200;font-style:normal;font-display:swap;src:local("Apple SD Gothic Neo Thin"),local("AppleSDGothicNeo-Thin")}
@font-face{font-family:SDG;font-weight:100;font-style:normal;font-display:swap;src:local("Apple SD Gothic Neo UltraLight"),local("AppleSDGothicNeo-UltraLight")}
/* 색: 파스텔 그린(#DEE8C3 #C3E8C6 #CFE9C3 #E8E6C3 #C3E8D3 #DAE8D3) + 스터디플래너식 회색 선 */
:root{color-scheme:light;--tx:#1c1c1e;--tx2:#3a3a3c;--mu:#8e8e93;--mu2:#636366;--line:#e5e5ea;--line2:#f0f0f3;--soft:#f6f6f8;
  --blue:#3478f6;--ok:#5cc46f;--okl:#effaf1;--okb:#86d493;--bad:#e5484d;--wn:#c8781f;--mint:#57C6A3;--mintd:#2f8f6f;
  --p1:#DEE8C3;--p2:#C3E8C6;--p3:#CFE9C3;--p4:#E8E6C3;--p5:#C3E8D3;--p6:#DAE8D3;--acc:#C3E8D3;--acch:#b3e0c7;--acctx:#1d4d3a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--tx);font:400 15px/1.45 SDG,"Apple SD Gothic Neo",-apple-system,"Malgun Gothic",system-ui,sans-serif;letter-spacing:-.01em;font-synthesis:none;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:16px;padding:10px 22px;background:#fff;border-bottom:1px solid var(--line)}
header h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.03em;white-space:nowrap}
#tabs{display:flex;gap:2px;margin-left:auto}
#tabs button{border:0;background:none;border-radius:9px;padding:6px 11px;font-size:14px;font-weight:600;color:var(--mu)}
#tabs button svg{display:none}
#tabs button:hover{color:var(--tx);background:var(--soft)}
#tabs button.on{color:var(--acctx);background:var(--acc)}
button,input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 11px;min-width:0}
textarea{width:100%;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:none;border-color:#9fd3bd}
input::placeholder,textarea::placeholder{color:#aeaeb2}
button{cursor:pointer;white-space:nowrap;font-weight:600;font-size:14px;color:var(--tx2)}
button:hover:not(:disabled){background:var(--soft)}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--mint);outline-offset:1px}
.pri{background:var(--acc);border-color:var(--acc);color:var(--acctx)}
.pri:hover:not(:disabled){background:var(--acch)}
.dk{background:var(--tx);border-color:var(--tx);color:#fff}
.dk:hover:not(:disabled){background:#3a3a3c}
.ghost{background:none;border-color:transparent}
.dg{color:var(--bad)}
.linkb{border:0;background:none;padding:0;color:var(--blue);text-decoration:underline;text-underline-offset:3px;font-weight:600;font-size:inherit}
.linkb:hover:not(:disabled){background:none}
main{max-width:1040px;margin:0 auto;padding:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px}
.banner{background:var(--okl);border-color:#d3eedb}
h2{font-size:22px;font-weight:600;margin:0 0 2px;letter-spacing:-.03em;line-height:1.3}
h3{margin:0 0 12px;font-size:17px;font-weight:600;letter-spacing:-.03em}
h4{margin:16px 0 6px;font-size:13px;color:var(--mu);font-weight:600}
p{margin:6px 0}
small,.mu{color:var(--mu)}
small{font-size:12.5px}
.warn{color:var(--wn)}.bad{color:var(--bad)}.ok{color:var(--mintd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end;margin-top:16px}
.grow{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stack{margin-bottom:16px}
.chip{font-size:12px;border-radius:6px;padding:1px 7px;color:var(--mu2);white-space:nowrap;background:var(--soft);font-weight:600}
.chip.on{background:var(--okl);color:var(--mintd)}
.fx{font-size:11px;border-radius:5px;padding:0 5px;background:#f0f0f3;color:var(--mu);font-weight:600;white-space:nowrap;display:inline-block;line-height:1.6;vertical-align:1px}
.empty{color:var(--mu);font-size:13.5px;padding:6px 0}
.ic{border:0;background:none;padding:5px 6px;color:#aeaeb2;border-radius:8px;line-height:0;font-weight:400}
.ic:hover:not(:disabled){background:var(--soft);color:var(--tx)}
.ic.del:hover:not(:disabled){color:var(--bad)}
.ic.tx{line-height:1.2;font-size:13px;font-weight:600;color:var(--mu)}
.qa{width:100%;margin-top:10px}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:4px 12px;font-size:13px;color:var(--mu)}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 0 0 1px var(--line)}
.lgd{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mu2);font-weight:600;margin-right:10px}
.lgd i{width:14px;height:10px;border-radius:3px;display:inline-block}
/* 체크 상자 (스터디플래너 모양) */
.sq{width:26px;height:26px;border-radius:8px;border:1.5px solid #d1d1d6;background:#fff;padding:0;flex:none;position:relative}
.sq:hover:not(:disabled){background:#fafafa}
.sq.on{border-color:var(--okb);background:var(--okl)}
.sq.on::after{content:"";position:absolute;inset:6px;border:2.5px solid var(--ok);border-radius:50%}
.sq.sm{width:22px;height:22px;border-radius:7px}
.sq.sm.on::after{inset:5px;border-width:2px}
.circ{width:28px;height:28px;border-radius:50%;border:2px solid #d1d1d6;background:#fff;padding:0;flex:none;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;line-height:1}
.circ.on{background:var(--ok);border-color:var(--ok)}
/* 일정 한 줄 */
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.cbar{width:10px;height:10px;border-radius:50%;background:var(--c,#d1d1d6);flex:none}
.ib{flex:1;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;text-align:left;border:0;background:none;padding:0;min-width:0;font-weight:400;color:var(--tx)}
.ib:hover:not(:disabled){background:none}
.ib .t{font-weight:600;font-size:15.5px;letter-spacing:-.02em}
.done .t{text-decoration:line-through;color:var(--mu)}
.tm{color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
.tlink{color:var(--blue);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;font-size:14px;font-variant-numeric:tabular-nums;font-weight:400}
.acts{display:inline-flex;flex:none}
/* 일정 넣기 (할 일 · 시간 칸 분리) */
.addf{margin-top:14px;padding:12px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;gap:8px}
.addf input,.addf select{background:#fff}
.af-t{width:100%;font-size:15px}
.af-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tf{display:inline-flex!important;align-items:center;gap:6px;margin:0!important;font-size:13px!important;color:var(--mu2)!important;font-weight:600;white-space:nowrap;flex:none}
.tf input{width:7.4em;padding:6px 8px;font-weight:400}
.tp{display:inline-flex;align-items:center;gap:2px;min-width:0}
.tp select{padding:6px 4px 6px 8px;font-weight:400;color:var(--tx);font-variant-numeric:tabular-nums;width:auto;min-width:0;text-align:center;text-align-last:center}
.tp .tp-c{color:var(--mu);font-weight:600;padding:0 1px}
label>.tp,.lbl>.tp{display:flex;width:100%;margin-top:4px}
label>.tp select,.lbl>.tp select{flex:1 1 0;display:block}
.tf .tp select{flex:none}
.durs{display:inline-flex;gap:4px;flex-wrap:wrap}
.dur{padding:4px 9px;font-size:12.5px;border-radius:8px;background:#fff}
.af-row select{flex:1}
/* 달력 */
.calh{display:grid;grid-template-columns:repeat(7,1fr);margin:4px 0 6px}
.dh{text-align:center;color:var(--mu);font-size:12.5px;font-weight:600}
.dh:first-child{color:var(--bad)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cd{min-height:104px;padding:5px 4px 6px;background:#fff;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0;position:relative}
.cd.pad{background:#fafafb;cursor:default}
.cd:not(.pad):hover{background:#fcfcfd}
.cd.sel{box-shadow:inset 0 0 0 2px var(--mint)}
.dn{font-size:12.5px;font-weight:600;align-self:flex-start;line-height:22px;min-width:22px;text-align:center;border-radius:11px;color:var(--tx2)}
.cd.sun .dn{color:var(--bad)}
.cd.td .dn{background:var(--tx);color:#fff}
.hbd{position:absolute;right:6px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--okb)}
.ce{display:flex;align-items:center;gap:3px;min-width:0;background:var(--f);border-left:2.5px solid var(--c);border-radius:3px;padding:1px 3px 1px 3px}
.cbx{width:12px;height:12px;border-radius:3px;border:1.2px solid #a9a9b0;background:#fff;padding:0;flex:none;position:relative}
.cbx:hover:not(:disabled){background:#fff;border-color:var(--tx2)}
.cbx.on{background:var(--ok);border-color:var(--ok)}
.cbx.on::after{content:"";position:absolute;left:3.3px;top:.6px;width:3px;height:6.5px;border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
.cbx.on:hover:not(:disabled){background:var(--ok)}
.cet{flex:1;min-width:0;border:0;background:none;padding:0;font-size:11px;font-weight:600;color:var(--tx2);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.55;letter-spacing:-.02em}
.cet:hover:not(:disabled){background:none;text-decoration:underline}
.cet .ctm{font-weight:400;color:var(--mu2)}
.ce.done .cet{text-decoration:line-through;color:var(--mu)}
.ce.g{border-left-style:dashed}
.cmore{font-size:11px;color:var(--mu);padding-left:3px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:12px 0 10px}
.lg{font-size:13px;border:0;background:none;padding:2px 0;display:inline-flex;gap:6px;align-items:center;font-weight:600;color:var(--tx2)}
.lg:hover:not(:disabled){background:none}
.lg i{width:11px;height:11px;border-radius:50%;background:var(--c);display:inline-block}
.lg.off{opacity:.35;text-decoration:line-through}
/* 10분 칸 시간표 */
.tg{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;user-select:none;-webkit-user-select:none}
.tgr{display:grid;grid-template-columns:38px 1fr;border-bottom:1px solid var(--line)}
.tgr:last-child{border-bottom:0}
.tgr .h{font-size:13.5px;color:var(--mu2);text-align:center;line-height:31px;border-right:1px solid var(--line);font-variant-numeric:tabular-nums}
.tgr.nowr .h{color:var(--tx);font-weight:600}
.cells{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:31px;position:relative}
.cell{grid-row:1;border-right:1px solid var(--line2);cursor:cell}
.cell:nth-child(6){border-right:0}
.cell.selc{background:rgba(87,198,163,.2)}
.cell.nowc{background:#f3faf6;box-shadow:inset 2px 0 0 var(--mint)}
.blk{grid-row:1;z-index:1;margin:2px 0 2px 1px;border:0;border-left:3px solid var(--c);border-radius:3px;background:var(--f);font-size:12px;font-weight:600;color:var(--tx2);line-height:27px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:left;letter-spacing:-.02em}
.blk:hover:not(:disabled){background:var(--f);filter:brightness(.98)}
.blk.done{opacity:.55;text-decoration:line-through}
.blk.pres{background:#eef5e4;border-left:0;margin:0;border-radius:0;cursor:default;z-index:0}
.blk.foc{background:var(--p2);border-left:3px solid #86d093;cursor:default;z-index:2}
.tg.ro .cell{cursor:default}
@media (hover:none),(pointer:coarse){.tg:not(.ro) .cell{cursor:pointer;-webkit-tap-highlight-color:rgba(95,207,196,.18)}}
/* 오늘 */
.tday{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"g l" "g a";grid-template-rows:auto 1fr;gap:0 28px;margin-bottom:16px}
.tday>.tgw{grid-area:g}
.tday>.tlist{grid-area:l}
.tday>.tadd{grid-area:a}
.grp{margin-bottom:4px}
.gh{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17.5px;margin:18px 0 0;letter-spacing:-.03em}
.grp:first-child .gh{margin-top:4px}
.gh i{width:13px;height:13px;border-radius:50%;background:var(--c);flex:none}
.gi{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.gi .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;border:0;background:none;padding:0;text-align:left;font-weight:400;color:var(--tx)}
.gi .tx:hover:not(:disabled){background:none}
.gi .tx .t{font-weight:600;font-size:16.5px;white-space:normal;overflow-wrap:anywhere;word-break:keep-all;letter-spacing:-.03em;line-height:1.35}
.tday>*{min-width:0}
.gh{overflow-wrap:anywhere}
.ib{white-space:normal}
.ib .t{min-width:0;overflow-wrap:anywhere;word-break:keep-all}
.gi.done .t{text-decoration:line-through;color:var(--mu)}
.gi .tlink{align-self:flex-start}
.dash{width:100%;border:1.5px dashed #8db4f4;color:var(--blue);background:none;border-radius:16px;padding:12px;font-weight:600;margin-top:14px;font-size:15px}
.dash:hover:not(:disabled){background:#f6f9ff}
.daylog{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tdhead{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"top log" "sub log";align-items:center;gap:2px 18px}
.tdtop{grid-area:top;display:flex;align-items:center;gap:6px;min-width:0}
.tdsub{grid-area:sub;display:block}
.tdhead .daylog{grid-area:log}
.tdpick{position:relative;display:block;min-width:0;flex:0 1 auto;border-radius:8px}
.tdpick h2{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdpick:hover h2{text-decoration:underline;text-decoration-color:#d1d1d6;text-underline-offset:5px;text-decoration-thickness:1.5px}
.tdpk{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0;font-size:16px;-webkit-appearance:none;appearance:none;background:none}
.tdnav{display:flex;align-items:center;gap:2px;flex:none}
.tdnav .ic{color:var(--tx);padding:7px 8px}
.tdnav .ic:hover:not(:disabled){background:#f2f2f5}
.tdrel{color:var(--blue);font-weight:600}
.ck2{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.ck2:last-child{border-bottom:0}
.ck2 .t{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:none;padding:0;text-align:left;color:var(--tx)}
.ck2 button.t:hover:not(:disabled){background:none}
.ck2.done .t{text-decoration:line-through;color:var(--mu)}
/* 주간 (Structured) */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px}
.wday{border:0;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
.wday:hover:not(:disabled){background:none}
.wday .wl{font-size:12.5px;color:var(--mu);font-weight:600}
.wday .wn{font-size:19px;font-weight:600;width:40px;height:40px;line-height:40px;border-radius:50%;color:var(--tx)}
.wday.sel .wn{background:var(--tx);color:#fff}
.wday.td:not(.sel) .wn{box-shadow:inset 0 0 0 2px var(--mint)}
.wday .wd2{display:flex;gap:2px;height:8px;align-items:center}
.wday .wd2 i{width:6px;height:6px;border-radius:50%;background:var(--c,#d1d1d6)}
.tl{padding:4px 0}
.tlr{display:grid;grid-template-columns:50px 60px 1fr 40px;gap:0 10px;align-items:start}
.tlr .tt{font-size:12.5px;color:var(--mu);text-align:right;padding-top:17px;font-variant-numeric:tabular-nums}
.ax{display:flex;flex-direction:column;align-items:center;align-self:stretch}
.ico{width:54px;height:54px;border-radius:27px;display:grid;place-items:center;font-size:23px;background:var(--c);border:0;padding:0;flex:none;cursor:pointer}
.ico:hover:not(:disabled){background:var(--c)}
.ln{flex:1;width:3px;min-height:14px;background:var(--c);opacity:.75}
.ln.dsh{background:none;border-left:3px dotted #d1d1d6;width:0;opacity:1}
.tc{padding-top:8px;min-width:0}
.tc .tm2{font-size:13px;color:var(--mu)}
.tc .t{font-size:17px;font-weight:600;line-height:1.3;word-break:keep-all;letter-spacing:-.03em;color:var(--tx)}
.tc button.t{border:0;background:none;padding:0;text-align:left}
.tc button.t:hover:not(:disabled){background:none}
.tlr .ck{padding-top:13px}
.gapr{display:grid;grid-template-columns:50px 60px 1fr;gap:0 10px;min-height:44px}
.gapr .msg{align-self:center;font-size:13.5px;color:var(--mu)}
.gapr .msg b{color:var(--tx2)}
.nowl{display:grid;grid-template-columns:50px 1fr;gap:10px;align-items:center;margin:2px 0}
.nowl span{font-size:12.5px;font-weight:600;text-align:right;color:var(--bad)}
.nowl i{height:2px;background:#f19c94;border-radius:1px}
.wov{display:grid;grid-template-columns:36px repeat(7,1fr);position:relative}
.wov .hl{position:relative}
.wov .hl span{position:absolute;right:6px;font-size:11px;color:var(--mu);transform:translateY(-50%)}
.wcol{position:relative;border:0;background:none;padding:0;cursor:pointer}
.wcol::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--line2);border-radius:2px}
.wcol.sel::before{background:var(--p5)}
.wp{position:absolute;left:50%;width:40px;margin-left:-20px;border-radius:20px;display:grid;place-items:center;font-size:16px;background:var(--c);border:0;padding:0;cursor:pointer;overflow:hidden}
.wp:hover:not(:disabled){background:var(--c)}
.wp.done{opacity:.4}
.wp.wk{width:26px;margin-left:-13px;font-size:12px}
/* 홈 */
.hhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:2px 0 18px}
.hsub{font-size:13px;color:var(--mu);font-weight:600;letter-spacing:.01em}
.hdate{font-size:30px;font-weight:600;letter-spacing:-.04em;line-height:1.2}
.hright{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hclock{font-size:46px;font-weight:100;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.mini{padding:4px 10px;font-size:12.5px;border-radius:8px}
.goal{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:0;border-radius:18px;padding:20px 22px;margin-bottom:16px;background:var(--p1);color:var(--tx)}
.goal:hover:not(:disabled){background:#d7e3b8}
.goal .gl{font-size:12.5px;color:#66704c;font-weight:600}
.goal .gt{font-size:23px;font-weight:600;letter-spacing:-.04em;line-height:1.3;white-space:normal}
.goal .gs{font-size:13px;color:#66704c;font-weight:400}
.goal .gd{margin-left:auto;font-size:20px;font-weight:200;background:#fff;border-radius:12px;padding:6px 12px;font-variant-numeric:tabular-nums}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.studio{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.big{font-size:30px;font-weight:200;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums}
.stat{display:flex;gap:24px;flex-wrap:wrap;margin:12px 0 2px}
.stat div{display:flex;flex-direction:column}
.stat small{font-weight:600}
.bigbtn{flex:1;font-size:15px;padding:11px 10px;border-radius:12px}
.sess{display:flex;gap:6px;align-items:center;margin:5px 0;font-size:13px;flex-wrap:wrap;color:var(--mu2)}
.sess input{width:8.2em;padding:3px 6px;font-size:13px}
.mch{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.mch b{font-size:15px;font-weight:600}
.studio>div:last-child{max-width:360px;width:100%;justify-self:end}
.mcg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.mcg .w{font-size:11px;color:var(--mu);font-weight:600}
.mcg .w:first-child{color:var(--bad)}
.mcd{height:34px;border:0;border-radius:8px;padding:0;font-size:12px;font-weight:600;color:var(--tx2);background:var(--soft);display:grid;place-items:center;position:relative;min-width:0}
.mcd.l1{background:#eef4e2}.mcd.l2{background:var(--p1)}.mcd.l3{background:var(--p2)}.mcd.l4{background:#9fd8ab}
.mcd:hover:not(:disabled){filter:brightness(.97)}
.mcd.td{box-shadow:inset 0 0 0 1.5px var(--tx)}
.mcd.sun{color:var(--bad)}
.mcd i{position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--mu)}
.mleg{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--mu);margin-top:8px;flex-wrap:wrap}
.mleg span{width:11px;height:11px;border-radius:3px;display:inline-block}
.nowl1{font-size:13px;color:var(--mu);font-weight:600}
.nowt{font-size:21px;font-weight:600;letter-spacing:-.03em;margin:2px 0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:30px}
.prog{height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.prog i{display:block;height:100%;background:#9fd8ab}
.chart svg{width:100%;height:auto;display:block}
/* 습관 */
.hw{border-collapse:collapse;width:100%;min-width:440px}
.hw th{font-size:12.5px;color:var(--mu);font-weight:600;padding:4px 2px;line-height:1.25}
.hw th.td{color:var(--tx)}
.hw th small{font-weight:400}
.hw td{text-align:center;padding:8px 2px;border-top:1px solid var(--line)}
.hw td:first-child{text-align:left;font-weight:600;padding-right:10px;line-height:1.3}
.hw td:first-child small{font-weight:400}
.hw td.nd{color:#c7c7cc}
.hw .sq{margin:auto;display:block}
.strip{display:grid;grid-template-columns:repeat(28,1fr);gap:3px;min-width:0}
.strip i{aspect-ratio:1;border-radius:3px;background:var(--line2)}
.strip i.on{background:#9fd8ab}
.strip i.off{background:none;box-shadow:inset 0 0 0 1px var(--line2)}
.strip i.td{outline:1.5px solid var(--tx);outline-offset:-1.5px}
.hrow{display:grid;grid-template-columns:150px 1fr 64px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 프로젝트·인생 목표 */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:7px;width:100%;font-weight:400;color:var(--tx)}
.pc:hover:not(:disabled){border-color:#c9c9ce;background:#fff}
.pc .pt{font-weight:600;font-size:16.5px;letter-spacing:-.03em}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--mu)}
.bar{display:block;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:#9fd8ab}
.st{font-size:11.5px;border-radius:6px;padding:0 7px;background:var(--soft);color:var(--mu2);font-weight:600}
.st.진행중{background:var(--p5);color:var(--acctx)}.st.완료{background:var(--p2);color:var(--acctx)}.st.보류{background:#f7ecdc;color:var(--wn)}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filters button{border-radius:9px;padding:4px 12px;font-size:13px}
.filters button.on{background:var(--acc);border-color:var(--acc);color:var(--acctx)}
.step{display:flex;align-items:center;gap:8px;padding:9px 6px;border-bottom:1px solid var(--line);border-radius:0}
.step.now{background:#f5fbf8}
.step.done .t{text-decoration:line-through;color:var(--mu)}
.step .n{width:22px;text-align:center;color:var(--mu);font-variant-numeric:tabular-nums;flex:none;font-size:13px}
.step .grip{cursor:grab;color:#c7c7cc;flex:none;user-select:none}
.step.over{border-top:2px solid var(--mint)}
.nowtag{font-size:11px;color:var(--acctx);background:var(--acc);border-radius:6px;padding:0 6px;font-weight:600}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ref{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.ref img{width:100%;height:120px;object-fit:cover;background:var(--soft);display:block}
.ref .rb{padding:8px 10px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.ref .rb a{color:var(--blue);font-weight:600;word-break:break-all}
.why{white-space:pre-line;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px}
.lc .area{font-size:12px;color:var(--mintd);font-weight:600}
.lc .lt{font-size:17px;font-weight:600;line-height:1.35;letter-spacing:-.03em}
.lc>.row>.bar{flex:1}
.pl{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.pl .grow{border:0;background:none;text-align:left;padding:0;font-weight:400;color:var(--tx)}
.pl .grow:hover:not(:disabled){background:none;text-decoration:underline}
.pl .bar{width:60px}
.sd{width:8px;height:8px;border-radius:50%;background:#d1d1d6;flex:none}
.sd.진행중{background:var(--mint)}.sd.완료{background:var(--mintd)}.sd.보류{background:var(--wn)}
.vals{display:flex;gap:6px;flex-wrap:wrap}
.val{background:var(--p5);color:var(--acctx);border-radius:8px;padding:2px 10px;font-size:13px;font-weight:600}
/* 입력 창 */
dialog{border:0;border-radius:20px;background:#fff;color:var(--tx);width:min(94vw,520px);max-height:92vh;overflow:auto;padding:20px;box-shadow:0 16px 40px rgba(0,0,0,.16)}
dialog::backdrop{background:rgba(0,0,0,.28)}
dialog p{white-space:pre-line}
label,.lbl{display:block;margin:10px 0 4px;color:var(--mu);font-size:13px;font-weight:600}
.g2>*,.g3>*{min-width:0}
input[type=date],input[type=time]{min-width:0;max-width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:2.6em}
input[type=date]::-webkit-date-and-time-value{text-align:left}
label>input:not([type=checkbox]):not([type=radio]),label>select,label>textarea{display:block;width:100%;margin-top:4px;color:var(--tx);font-weight:400}
label .row>*,.lbl .row>*{color:var(--tx);font-weight:400}
.ck{display:inline-flex!important;gap:6px;align-items:center;margin:0!important;color:var(--tx2)!important;font-weight:600}
.ck input{width:auto!important;margin:0;accent-color:var(--mint)}
.ttl{flex:1;font-size:18px;font-weight:600;letter-spacing:-.03em}
.g3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.catpick{margin:0!important}
.catpick input,.dpick input{position:absolute;opacity:0;pointer-events:none}
.catpick span{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:4px 10px;font-size:13px;color:var(--tx2);cursor:pointer;background:#fff;font-weight:600}
.catpick span i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.catpick input:checked+span{border-color:var(--c);background:var(--f)}
.catpick input:focus-visible+span,.dpick input:focus-visible+span{outline:2px solid var(--mint)}
.dpicks{display:flex;gap:4px;flex-wrap:wrap}
.dpick{margin:0!important}
.dpick span{display:inline-block;width:34px;height:34px;line-height:32px;text-align:center;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--tx2);cursor:pointer;font-weight:600}
.dpick input:checked+span{background:var(--tx);border-color:var(--tx);color:#fff}
.sw{width:16px;height:16px;border-radius:50%;display:inline-block;flex:none}
.set-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
ol.howto{padding-left:20px;margin:6px 0}
ol.howto li{margin:4px 0}
details summary{cursor:pointer;font-weight:600;color:var(--tx2)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:#2c2c2e;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:92vw;display:flex;gap:12px;align-items:center;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast.bad{background:var(--bad)}
#toast button{background:none;border:1px solid rgba(255,255,255,.45);color:#fff;padding:2px 10px}
.hide-d{display:none}
.filebtn{display:inline-flex!important;align-items:center;margin:0!important;border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:14px!important;font-weight:600;color:var(--tx2)!important;cursor:pointer;position:relative;overflow:hidden}
.filebtn:hover{background:var(--soft)}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
@media(max-width:900px){.hgrid{grid-template-columns:1fr}}
@media(max-width:680px){
  header{padding:10px 16px}
  #tabs{position:fixed;left:0;right:0;bottom:0;margin:0;gap:0;background:#fff;border-top:1px solid var(--line);padding:5px 2px calc(5px + env(safe-area-inset-bottom));z-index:7}
  #tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:3px 0;color:var(--mu);background:none;min-width:0;border-radius:8px;letter-spacing:-.04em}
  #tabs button svg{display:block;width:23px;height:23px}
  #tabs button.on{background:none;color:var(--tx)}
  main{padding:14px 14px 96px}
  input,select,textarea{font-size:16px}
  .card{padding:16px;border-radius:16px}
  .two,.pgrid,.lgrid{grid-template-columns:1fr}
  #toast{bottom:84px}
  .cal{border-radius:12px}
  .cd{min-height:74px;padding:3px 2px}
  .ce{padding:1px 2px;gap:2px;border-left-width:2px;align-items:center}
  .cbx{width:10px;height:10px;margin-top:0}
  .cbx.on::after{left:2.6px;top:.2px;width:2.4px;height:5.4px}
  .cet{font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:clip;display:block;line-height:1.5;letter-spacing:-.05em}
  .g3{grid-template-columns:1fr 1fr}
  .g3 label:first-child{grid-column:1/-1}
  .tday{grid-template-columns:46% 1fr;grid-template-areas:"g l" "a a";gap:0 12px}
  .tdhead{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "sub" "log";gap:2px}
  .tdhead .tdpick{flex:1 1 auto}
  .tdhead .daylog{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .tdhead .daylog .tf{width:100%;justify-content:space-between}
  .tdhead .daylog .tf input{width:auto;flex:1;min-width:0}
  .tday>.tadd{margin-top:8px}
  .tgr{grid-template-columns:26px 1fr}
  .tgr .h{font-size:12px;line-height:27px}
  .cells{grid-template-rows:27px}
  .blk{font-size:10.5px;line-height:23px;padding:0 3px;border-left-width:2px}
  .tg{border-radius:14px}
  .gh{font-size:15.5px;gap:7px;margin-top:14px}
  .gh i{width:11px;height:11px}
  .gi{gap:8px;padding:10px 0}
  .gi .tx .t{font-size:14.5px}
  .gi .tlink{font-size:12.5px}
  .gi .sq{width:24px;height:24px;border-radius:7px}
  .gi .sq.on::after{inset:5px;border-width:2px}
  .hide-m{display:none}
  .dash{font-size:14px;padding:10px}
  .tlr{grid-template-columns:42px 54px 1fr 32px;gap:0 7px}
  .gapr{grid-template-columns:42px 54px 1fr;gap:0 7px}
  .nowl{grid-template-columns:42px 1fr}
  .ico{width:48px;height:48px;font-size:20px}
  .tc .t{font-size:15.5px}
  .wday .wn{width:34px;height:34px;line-height:34px;font-size:17px}
  .hdate{font-size:25px}
  .hclock{font-size:36px}
  .goal{padding:16px 18px}
  .goal .gt{font-size:19px}
  .studio{grid-template-columns:1fr 1fr;gap:14px}
  .big{font-size:24px}
  .stat{gap:14px}
  .bigbtn{font-size:14px;padding:10px 6px}
  .mcg{gap:2px}
  .mcd{font-size:10.5px;border-radius:6px;height:26px}
  .studio>div:last-child{max-width:none}
  .hrow{grid-template-columns:1fr auto;grid-template-areas:"n c" "s s";gap:6px 8px}
  .hrow b{grid-area:n}.hrow small{grid-area:c}.hrow .strip{grid-area:s}
  .hw{min-width:0}
  .hw td:first-child{font-size:14px;padding-right:6px}
  .hw .sq.sm{width:20px;height:20px;border-radius:6px}
  .hw .sq.sm.on::after{inset:4px}
  .mch b{font-size:14px}
  .strip{gap:2px}
}
@media(max-width:680px){.studio .bigbtn{flex:1 1 100%}}
@media(max-width:340px){.studio{grid-template-columns:1fr}}
/* ===== v6: 탭 · 더보기 ===== */
#tabs{overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{padding:6px 9px;font-size:13.5px;flex:none}
#tabs .moreb{display:none}
#tabs .gearb{padding:6px 8px;color:var(--mu)}
#tabs .gearb svg{display:block;width:19px;height:19px}
#tabs .gearb span{display:none}
@media(max-width:1020px) and (min-width:681px){#tabs button{padding:6px 6px;font-size:12.5px}header h1{display:none}}
.moregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.moregrid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border-radius:14px;font-size:13px}
.moregrid button svg{width:26px;height:26px}
.moregrid button.on{background:var(--acc);border-color:var(--acc);color:var(--acctx)}
/* 종이 */
.paper{background-color:#fff;background-image:linear-gradient(#efefef 1px,transparent 1px),linear-gradient(90deg,#efefef 1px,transparent 1px);background-size:14px 14px;background-position:-1px -1px}
.dotpaper{background:#fff radial-gradient(circle,#cdcdd2 1.05px,transparent 1.35px) 0 0/20px 20px}
.ring{position:absolute;left:50%;top:50%;width:118%;height:118%;transform:translate(-50%,-50%) rotate(var(--rot,0deg));pointer-events:none;overflow:visible}
/* ===== 습관 (월간 트래커 12칸) ===== */
.hpage{position:relative;padding:24px 84px 30px 26px;border-radius:18px}
.hpg-head{display:flex;align-items:center;gap:6px;margin-bottom:22px}
.hpg-head h2{margin:0 6px}
.mgoal{position:absolute;right:20px;top:26px;writing-mode:vertical-rl;font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--tx)}
.mgoal small{font-size:12px;font-weight:400;color:var(--mu);letter-spacing:0;margin-top:10px}
.hgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 30px}
.hslot{min-width:0}
.htitle{display:block;margin:0 auto 10px;width:62%;min-height:32px;border:0;border-radius:4px;background:rgba(128,128,128,.10);font-weight:600;font-size:14.5px;color:var(--tx);padding:5px 8px;white-space:normal;line-height:1.3;letter-spacing:-.02em}
.htitle:hover:not(:disabled){background:rgba(128,128,128,.17)}
.htitle.blank{color:transparent}
.htitle.blank:hover{color:var(--mu)}
.hcal{background:rgba(0,0,0,.028);padding:6px 8px 10px;border-radius:2px}
.hhd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-weight:600;font-size:13.5px;margin-bottom:4px;color:var(--tx)}
.hhd span:nth-child(6){color:#8e8e93}
.hhd span:nth-child(7){color:#d24b43}
.hgb{display:grid;grid-template-columns:repeat(7,1fr)}
.hd{position:relative;aspect-ratio:1;border:0;border-radius:0;background:rgba(255,255,255,.78);padding:0;font-size:10.5px;color:#7a7a7e;font-weight:400;outline:1px solid #5d5d61;outline-offset:-.5px;display:grid;place-items:center;min-width:0;line-height:1}
.hd.we{color:#b4b4b8;background:rgba(240,240,242,.8)}
.hd:hover:not(:disabled){background:#eef7f1}
.hd:disabled{opacity:1;cursor:default}
.hd.pad{outline:0;background:none}
.hd.td span{color:var(--tx);font-weight:600}
.hcnt{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-top:6px}
/* ===== 위시리스트 100 ===== */
.wishp{padding:30px 34px 34px;border-radius:18px}
.whd{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.wtitle{display:flex;align-items:flex-start;gap:10px;font-size:52px;line-height:1;letter-spacing:-.02em}
.wtitle .w1{font-weight:100}
.wtitle .w2{font-weight:600;display:flex;flex-direction:column;align-items:center;font-size:44px;margin-top:8px;letter-spacing:-.05em}
.wtitle .w2 small{font-size:11px;font-weight:400;letter-spacing:.18em;margin-top:4px}
.wstat{margin-left:auto;font-size:14px;color:var(--mu2)}
.wstat b{font-weight:600;color:var(--tx)}
.wleg{font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.lgring{position:relative;display:inline-block;width:20px;height:20px}
.wcols{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.wrow{display:flex;align-items:center;gap:6px;height:40px}
.wnum{position:relative;flex:none;width:40px;height:34px;border:0;background:none;padding:0;font-size:15px;font-weight:400;color:var(--tx2);display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.wnum:hover:not(:disabled){background:none}
.wnum:hover span{color:var(--tx)}
.wnum i{font-style:normal}
.wnum .ring{width:34px;height:34px}
.wtx{flex:1;min-width:0;border:0;border-bottom:1px dashed transparent;border-radius:0;background:transparent;padding:6px 2px;font-size:15.5px;letter-spacing:-.02em}
.wtx:focus{border-bottom-color:#c7c7cc;background:rgba(255,255,255,.7)}
.wrow.s2 .wtx{color:var(--mu)}
.wck{flex:none;width:22px;color:#3fae5a;font-weight:600;font-size:17px;text-align:center}
/* ===== 사진 캘린더 ===== */
.pbook{padding:22px 22px 26px;border-radius:18px;border:1px solid var(--line)}
.phd{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pmon{background:#2b2b2b;color:#fff;font-weight:600;font-size:15px;letter-spacing:.14em;padding:7px 16px 6px;border-radius:3px 3px 0 0}
.psub{font-size:12.5px;color:#8a8a8e;letter-spacing:.08em;padding-bottom:4px}
.phgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1.2px solid #bfbfbf;border-left:1.2px solid #bfbfbf;background:rgba(255,255,255,.35)}
.pwh{display:flex;align-items:center;gap:8px;padding:5px 7px;font-size:11.5px;letter-spacing:.12em;font-weight:600;color:#3a3a3c;border-right:1.2px solid #bfbfbf;border-bottom:1.2px solid #bfbfbf;background:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden}
.pwh b{font-weight:400;letter-spacing:0;font-size:11px;color:#6e6e73}
.pwh.sat{background:rgba(235,235,238,.9)}
.pwh.sun{background:#f5d9d9;color:#b0413b}
.phc{position:relative;aspect-ratio:1/1.16;border-right:1.2px solid #bfbfbf;border-bottom:1.2px solid #bfbfbf;display:flex;flex-direction:column;min-width:0}
.phc.pad{background:rgba(250,250,250,.55)}
.phc.pad .pn{color:#c7c7cc}
.pn{height:19px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px;font-size:11.5px;color:#6e6e73;letter-spacing:.02em;border-bottom:1px solid #e2e2e2;background:rgba(255,255,255,.8)}
.phc.sun .pn{background:#f7dede;color:#b0413b}
.phc.td .pn b{background:#2b2b2b;color:#fff;border-radius:3px;padding:0 4px;font-weight:600}
.pn b{font-weight:400}
.pn svg{width:11px;height:11px;color:#8e8e93}
.pbody{flex:1;position:relative;min-height:0}
.stampw{position:absolute;inset:7% 9% 8%;display:block;border:0;background:none;padding:0;border-radius:0;cursor:zoom-in;filter:drop-shadow(0 1px 1.3px rgba(40,30,10,.3))}
.stampw:hover:not(:disabled){background:none;transform:rotate(-1.5deg)}
.stamp{--d:4.5px;--t:4.5px;display:block;width:100%;height:100%;padding:0;background:none;
  -webkit-mask:linear-gradient(#000 0 0) center/calc(100% - 2*var(--d)) calc(100% - 2*var(--d)) no-repeat,repeating-linear-gradient(90deg,#000 0 var(--t),#0000 var(--t) calc(2*var(--t))) top/100% var(--d) no-repeat,repeating-linear-gradient(90deg,#000 0 var(--t),#0000 var(--t) calc(2*var(--t))) bottom/100% var(--d) no-repeat,repeating-linear-gradient(180deg,#000 0 var(--t),#0000 var(--t) calc(2*var(--t))) left/var(--d) 100% no-repeat,repeating-linear-gradient(180deg,#000 0 var(--t),#0000 var(--t) calc(2*var(--t))) right/var(--d) 100% no-repeat;
  mask:linear-gradient(#000 0 0) center/calc(100% - 2*var(--d)) calc(100% - 2*var(--d)) no-repeat,repeating-linear-gradient(90deg,#000 0 var(--t),#0000 var(--t) calc(2*var(--t))) top/100% var(--d) no-repeat,repeating-linear-gradient(90deg,#000 0 var(--t),#0000 var(--t) calc(2*var(--t))) bottom/100% var(--d) no-repeat,repeating-linear-gradient(180deg,#000 0 var(--t),#0000 var(--t) calc(2*var(--t))) left/var(--d) 100% no-repeat,repeating-linear-gradient(180deg,#000 0 var(--t),#0000 var(--t) calc(2*var(--t))) right/var(--d) 100% no-repeat}
.stamp img{display:block;width:100%;height:100%;object-fit:cover;background:#e9e9ec}
.pmore{position:absolute;right:5px;bottom:4px;font-size:10.5px;font-weight:600;background:#2b2b2b;color:#fff;border-radius:6px;padding:0 5px}
.padd{width:100%;height:100%;border:0;background:none;color:transparent;font-size:22px;font-weight:200;border-radius:0}
.padd:hover:not(:disabled){background:rgba(87,198,163,.08);color:var(--mint)}
.phc.drop{box-shadow:inset 0 0 0 2px var(--mint)}
.pnote{margin-top:16px;border-top:1.2px solid #bfbfbf;padding-top:6px}
.pnote textarea{border:0;background:repeating-linear-gradient(transparent 0 27px,#e2e2e2 27px 28px);line-height:28px;padding:0 4px;font-size:15px;min-height:84px}
.pnote textarea:focus{border:0}
/* 사진 크게 보기 */
#pv{width:min(96vw,1100px);padding:16px}
.pvwrap{position:relative;display:flex;justify-content:center;align-items:center;margin:10px 0;background:#f6f6f8;border-radius:12px;min-height:200px}
.pvwrap img{display:block;max-width:100%;max-height:68vh;width:auto;height:auto}
.pvwrap.full{display:block;overflow:auto;max-height:72vh}
.pvwrap.full img{max-width:none;max-height:none}
.bubble{position:absolute;left:5%;bottom:7%;max-width:62%;background:#fff;border:1.6px solid #2b2b2b;border-radius:22px;padding:9px 15px;font-size:15px;line-height:1.4;font-weight:600;transform:rotate(-3deg);white-space:pre-wrap;word-break:keep-all;color:var(--tx)}
.bubble::after{content:"";position:absolute;left:26px;bottom:-11px;width:16px;height:16px;background:#fff;border-right:1.6px solid #2b2b2b;border-bottom:1.6px solid #2b2b2b;transform:skewX(28deg) rotate(45deg)}
.pvwrap.full .bubble{position:sticky;left:12px;bottom:12px;display:inline-block;margin:-80px 0 0 12px}
.bubble[hidden]{display:none}
/* ===== 독서 기록 ===== */
.bres{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto;margin:8px 0}
.bres button{display:flex;gap:10px;align-items:center;text-align:left;font-weight:400;padding:6px 8px}
.bres img{width:38px;height:54px;object-fit:cover;border-radius:2px;background:var(--soft);flex:none}
.bres b{font-weight:600}
.bdet{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:start}
.bcov{position:relative;width:120px;aspect-ratio:1/1.45;border-radius:3px;overflow:hidden;background:var(--c);color:var(--ink);display:flex;align-items:flex-end;padding:10px;font-weight:600;font-size:14px;line-height:1.3;box-shadow:0 1px 3px rgba(0,0,0,.15);flex:none}
.bcov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.qt{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.qp{flex:none;min-width:48px;font-size:13px;font-weight:600;color:var(--c,var(--mintd));font-variant-numeric:tabular-nums;padding-top:2px}
.qx{flex:1;white-space:pre-wrap;font-size:15px;line-height:1.6;letter-spacing:-.01em}
.qadd{display:grid;grid-template-columns:78px 1fr auto;gap:6px;align-items:start;margin-top:10px}
.qadd input{text-align:center}
.cswatch{display:inline-block;width:26px;height:26px;border-radius:6px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);vertical-align:middle}
.cpick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cpick input[type=color]{width:40px;height:32px;padding:2px;border-radius:8px}
.qcard{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qcard .bar2{width:4px;border-radius:2px;background:var(--c);flex:none}
@media(max-width:680px){
  #tabs button{flex:1;font-size:10px;padding:3px 0}
  #tabs button:hover{background:none;color:var(--mu)}
  #tabs button.on:hover{color:var(--tx)}
  #tabs button.mt,#tabs .moreb{display:flex}
  #tabs button:not(.mt):not(.moreb){display:none}
  #tabs .moreb svg{display:block}
  .hpage{padding:18px 14px 22px}
  .mgoal{position:static;writing-mode:horizontal-tb;font-size:26px;margin-bottom:8px}
  .mgoal small{margin:0 0 0 8px}
  .hgrid3{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
  .htitle{width:86%;font-size:13.5px;min-height:28px}
  .hcal{padding:4px 4px 7px}
  .hhd{font-size:11.5px}
  .hd{font-size:9px}
  .wishp{padding:20px 14px 24px}
  .wtitle{font-size:38px}.wtitle .w2{font-size:32px}
  .wcols{grid-template-columns:1fr}
  .pbook{padding:14px 8px 18px}
  .pwh{flex-direction:column;align-items:flex-start;gap:0;padding:3px 3px;font-size:8.5px;letter-spacing:.06em}
  .pwh b{font-size:8.5px}
  .pn{height:15px;font-size:9.5px;padding:0 3px}
  .stampw{inset:6% 7% 7%}
  .stamp{--d:2px;--t:2.6px}
  .pmore{font-size:9px;right:2px;bottom:2px;padding:0 3px}
  .bdet{grid-template-columns:90px 1fr;gap:12px}
  .bcov{width:90px}
  .qadd{grid-template-columns:64px 1fr}
  .qadd button{grid-column:1/-1}
}
/* ===== v7 독서 기록: shelf of years ===== */
.bkpage{padding:26px 30px 30px}
.bkhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:18px;border-bottom:2px solid #dcdce0;margin-bottom:28px}
.bkhead h2{font-size:34px;font-weight:600;letter-spacing:-.06em;margin:0;line-height:1}
.shelfwrap{margin-bottom:48px}
.syear{font-size:27px;font-weight:600;letter-spacing:-.05em;margin:0 0 16px;line-height:1}
.shelf{position:relative}
.srows{--row:152px;display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:1px;min-height:var(--row);background:linear-gradient(to bottom,transparent calc(var(--row) - 2.5px),#1c1c1e calc(var(--row) - 2.5px)) 0 0/100% var(--row) repeat-y}
.bk{position:relative;height:var(--row);display:flex;align-items:flex-end;padding-bottom:2.5px;flex:none}
.spine{position:relative;width:var(--w);height:var(--h);background:var(--c);color:var(--ink);border:0;border-radius:1px 1px 0 0;padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;overflow:hidden;cursor:pointer;font-weight:600;box-shadow:inset 1px 0 0 rgba(255,255,255,.2),inset -1px 0 0 rgba(0,0,0,.14);transition:transform .15s}
.spine:hover:not(:disabled){background:var(--c);transform:translateY(-6px)}
.spcov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:4% 50%;transform:scale(1.04)}
.sthd{flex-wrap:wrap;row-gap:6px}
.sthd h3{white-space:nowrap;flex:1 0 auto}
.spimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.spine.real{padding:0;background:#ddd;box-shadow:inset -1px 0 0 rgba(0,0,0,.18),inset 1px 0 0 rgba(255,255,255,.25)}
.spreal{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
.bsprev{width:30px;height:120px;flex:none;border:1px solid var(--line);border-radius:2px;background:#f5f5f7;overflow:hidden}
.bsprev img{width:100%;height:100%;object-fit:fill;display:block}
.sp-t{position:relative;z-index:1;writing-mode:vertical-rl;text-orientation:mixed;font-size:var(--fs);letter-spacing:.04em;line-height:1.05;min-height:0;max-height:78%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.spine.art .sp-t{background:var(--c);padding:4px 1px;border-radius:1px;margin-top:10%;box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 12%,transparent)}
.sp-a{position:relative;z-index:1;writing-mode:vertical-rl;font-size:calc(var(--fs) - 1.5px);font-weight:400;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:30%;flex:none}
.sp-logo{position:relative;z-index:1;margin-top:auto;flex:none;font-size:6.5px;font-weight:600;opacity:.75;max-width:92%;overflow:hidden;white-space:nowrap}
.spine.art .sp-logo{background:var(--c);padding:1px 2px;border-radius:1px}
.sp-band{position:relative;z-index:1;flex:none;width:100%;height:5px;border-top:1px solid currentColor;border-bottom:1px solid currentColor;opacity:.32}
.sp-band.b1{height:0;border-bottom:0;border-top-width:2px}
.sp-band.b2{height:14px;border:0;background:currentColor;opacity:.13}
.sp-band.b3{width:7px;height:7px;border:1.2px solid currentColor;border-radius:50%;opacity:.45}
.spine.reading::after{content:"";position:absolute;top:0;right:2px;width:5px;height:15px;background:#e5484d;clip-path:polygon(0 0,100% 0,100% 100%,50% 74%,0 100%);z-index:2}
.spine.paused{filter:grayscale(.6) opacity(.7)}
.sempty{align-self:center;margin:auto;color:#a1a1a6;font-size:14px}
/* 책등에 마우스를 올리면 표지 + 포스트잇 + 메모 카드 */
.bpop{position:absolute;left:50%;bottom:16px;transform:translateX(calc(-50% + var(--dx,0px)));z-index:30;display:none;pointer-events:none;width:236px;height:250px}
.bk:hover .bpop{display:block}
.bpc{position:absolute;left:26px;top:0;width:128px;height:186px;border-radius:2px;overflow:hidden;background:var(--c);color:var(--ink);font-weight:600;font-size:13px;line-height:1.3;padding:10px;display:flex;align-items:flex-end;box-shadow:0 14px 28px rgba(0,0,0,.28)}
.bpc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bmemo{position:absolute;left:96px;top:66px;width:132px;background:#fdf6e2;padding:13px 11px 10px;font-size:12px;line-height:1.5;font-weight:600;color:#3a3a3c;box-shadow:0 4px 10px rgba(0,0,0,.16);transform:rotate(2deg)}

.bnote{position:absolute;left:88px;top:150px;width:146px;background:#fffdf5;padding:12px 12px 10px;font-size:12px;line-height:1.45;color:#3a3a3c;box-shadow:0 4px 12px rgba(0,0,0,.17);display:flex;flex-direction:column;gap:2px;transform:rotate(-1.5deg)}
.bnote b{font-size:13.5px;font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sfoot{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;margin-top:10px}
.scount{font-size:31px;font-weight:600;letter-spacing:-.05em;line-height:1;display:inline-flex;align-items:baseline}
.scount small{font-size:14px;font-weight:600;margin-left:1px;letter-spacing:0}
.scount button{border:0;background:none;padding:0 6px;color:#c7c7cc;font-size:20px;font-weight:200;line-height:1}
.scount button:hover:not(:disabled){background:none;color:var(--tx)}
.sstats{margin-left:auto;display:flex;gap:4px 18px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:#a1a1a6}

.sstats .tag{font-style:normal;background:#efeff2;color:var(--tx);font-weight:600;border-radius:5px;padding:2px 8px;margin-left:6px}
.sstats button{border:0;background:none;padding:0;color:#a1a1a6;font-size:12.5px;font-weight:400;display:inline-flex;gap:5px;align-items:center}
.sstats button:hover:not(:disabled){background:none;color:var(--tx)}
.favb{border:0;background:none;padding:0 4px;font-size:18px;color:#c7c7cc;vertical-align:-1px}
.favb.on{color:#e5484d}
.favb:hover:not(:disabled){background:none;color:#e5484d}
.bnoteinfo{font-size:12.5px;line-height:1.5;background:#fff8e8;border-radius:10px;padding:8px 10px;color:#7a5a16}
.bnoteinfo.bad{background:#fdeceb;color:#a33a34}
.samea{display:flex;gap:8px;flex-wrap:wrap}
/* 독서 캘린더 (reading calendar) */
.rc-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.rc-head h3{font-size:34px;font-weight:600;letter-spacing:-.06em;margin:0 6px 0 0;line-height:1}
.rc-head .seg button{padding:4px 10px;font-weight:600}
.rhead{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1.5px solid #3a3a3c;padding-bottom:9px}
.rhead span{font-size:11.5px;font-weight:600;letter-spacing:.16em;color:#a1a1a6;padding-left:12px}
.rcal{border:0}
.rwk{position:relative;border-bottom:1px solid #e3e3e6}
.rdays{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr)}
.rdays span{border-right:1px solid #f0f0f2;padding:10px 12px;font-size:19px;font-weight:400;letter-spacing:-.02em;color:var(--tx);font-variant-numeric:tabular-nums;line-height:1}
.rdays span:last-child{border-right:0}
.rdays span.out{color:#d1d1d6}
.rdays span.td{font-weight:600;color:var(--mintd)}
.rtapes{position:relative;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:12px;padding-top:44px}
.tape{position:relative;grid-row:var(--l);margin:1.5px -1px;height:9px;border:0;border-radius:0;padding:0;background:color-mix(in srgb,var(--c) 52%,transparent);cursor:pointer;transform:rotate(var(--r,0deg));overflow:hidden;
  clip-path:polygon(2px 0,calc(100% - 2px) 0,100% 25%,calc(100% - 2px) 50%,100% 75%,calc(100% - 2px) 100%,2px 100%,0 75%,2px 50%,0 25%)}
.tape span{position:absolute;left:-9999px}
.tape::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.14) 0 1px,transparent 1px 6px)}
.tape:hover:not(:disabled){background:color-mix(in srgb,var(--c) 85%,transparent)}

.rcd{display:flex;justify-content:center;padding:0 6px}
.rcv{position:relative;width:58px;aspect-ratio:1/1.42;flex:none;border:0;border-radius:2px;padding:0;overflow:hidden;background:var(--c);color:var(--ink);box-shadow:0 5px 12px rgba(0,0,0,.2);pointer-events:auto;cursor:pointer;margin-left:calc(var(--j,0) * -30px);font-size:9px;font-weight:600;line-height:1.2;text-align:left}

.rcv span{position:absolute;left:5px;right:5px;bottom:5px}
.samea .rcv{margin:0;width:52px}
@media(max-width:680px){

}

/* ---------- 달력 ---------- */
function vCal() {
  const [y, m] = cm.split('-').map(Number), off = new Date(y, m - 1, 1).getDay(), n = new Date(y, m, 0).getDate(), T0 = today();
  const cells = [...Array(off).fill(''), ...Array.from({ length: n }, (_, k) => `${cm}-${p2(k + 1)}`)];
  while (cells.length % 7) cells.push('');
  let weeks = '';
  for (let w = 0; w < cells.length; w += 7) {
    weeks += '<div class="dzwk">';
    for (let k = 0; k < 7; k++) {
      const s = cells[w + k];
      if (!s) { weeks += '<span class="dzcd"></span>'; continue; }
      const its = dayItems(s).filter(i => !isHabitItem(i) && (!i.fixed || by(D.rules, i.rule)?.onCal)).sort((a, b) => (a.time ? 0 : 1) - (b.time ? 0 : 1) || (a.time || '').localeCompare(b.time || ''));
      weeks += `<button class="dzcd${k === 0 ? ' sun' : ''}${s === T0 ? ' td' : ''}" data-a="dayGo" data-d="${s}" aria-label="${esc(kd(s))}${its.length ? ', ' + esc(its.map(i => i.title).join(', ')) : ''}"><span class="dn">${+s.slice(8)}</span><span class="dzchips">`
        + its.slice(0, 3).map(i => `<span class="dzchip${i.done ? ' done' : ''}" style="--f:${fillOf(i)}">${esc(first3(i.title))}</span>`).join('')
        + (its.length > 3 ? `<span class="dzmore">+${its.length - 3}개</span>` : '') + '</span></button>';
    }
    weeks += '</div>';
  }
  const ms = `${cm}-01`, me = `${cm}-${p2(n)}`;
  const ps = D.projects.filter(p => p.status === '진행 중' && (!p.due || p.due >= ms) && (!p.start || p.start <= me));
  const pr = (k, v) => `<div class="dzr nol"><span class="dzl"></span><div class="dzv"><b class="c1 dzb">${k ? '' : '진행중인 프로젝트'}</b>${v}</div></div>`;
  const pl = ps.length ? ps.slice(0, 3).map((p, k) => pr(k, `<button class="c2 dzpv" data-a="proj" data-id="${esc(p.id)}"><i>*</i>${esc(p.title)}</button>`)).join('') + (ps.length > 3 ? pr(1, `<button class="c2 dzpv dzmore" data-a="goProj">+${ps.length - 3}개</button>`) : '')
    : pr(0, '<button class="c2 dzpv mu" data-a="goProj">이번 달 진행 중인 프로젝트가 없어요</button>');
  return `<div class="dz dz-cal">${dzHead('cal', ms)}<div class="dzcal"><div class="dzwh">${[...'SMTWTFS'].map((x, k) => `<span class="${k === 0 ? 'sun' : k === 6 ? 'sat' : ''}">${x}</span>`).join('')}</div>${weeks}</div><section class="dzs dzproj">${pl}</section></div>`;
}

/* ---------- 오늘 ---------- */
function vToday() {

  const from = Math.min(F.w, ...gl.map(x => x.a)), to = Math.max(F.s, ...gl.map(x => x.b));
  const note = D.notes[t] || '';

  // 분류별 목록

    .map(g => ({ ...g, its: main.filter(i => (i.cat && catOf(i.cat) ? i.cat : '') === g.id) })).filter(g => g.its.length)

  const xb = i => `<button class="dzx" data-a="dzDel" data-id="${esc(i.id)}" aria-label="${i.fixed ? '이 날만 빼기' : '삭제'}: ${esc(i.title)}">${XX}</button>`;

  let list = groups.map(g => `<div class="dzg" style="--c:${g.c}"><div class="dzgh"><i></i>${esc(g.name)}</div>${g.its.map(li).join('')}</div>`).join('');

  const ruleWeek = rid => { const r = by(D.rules, rid); let a = 0, b = 0; for (let k = 0; k < 7; k++) { const d = addD(m0, k); if (r && r.days.includes(wd(d))) { b++; if (D.ruleLog[rid]?.[d]?.done) a++; } } return `${a}/${b || 7}`; };
  const hab = its.filter(isHabitItem).map(i => `<div class="dzit dzhab${i.done ? ' done' : ''}"><div class="dzi1">${dzBox(i)}<button class="dzname" data-a="open" data-id="${esc(i.id)}">${esc(i.title)}</button><small class="dzwk7 dznum">${i.fixed ? `${wk} ${ruleWeek(i.rule)}` : ''}</small>${xb(i)}</div></div>`)
    .concat(D.habits.map(x => { const on = hDone(t, x); return `<div class="dzit dzhab${on ? ' done' : ''}"><div class="dzi1"><button class="dzc${on ? ' on' : ''}" data-a="habit" data-id="${esc(x.id)}" data-d="${t}" aria-pressed="${on}" aria-label="${esc(x.name)}"${t > T0 ? ' disabled' : ''}>${on ? CHK : ''}</button><span class="dzname">${esc(x.name)}</span><small class="dzwk7 dznum">${wk} ${hWeek(x, m0)}/${x.perWeek || 7}</small><span class="dzx sp"></span></div></div>`; }));
  const hc = D.cats.find(c => isHabitCat(c.id));

  if (!list) list = `<p class="dzempty mu">${isT ? '오늘' : '이 날'}은 일정이 없어요. 왼쪽 시간 칸을 누르면 그 시각부터 일정을 넣어요.</p>`;
  const top = od.length ? `<div class="dzod"><small>못 끝낸 일 <span class="dznum">${od.length}</span>개</small><button class="dzu" data-a="inbox">가져오기</button></div>` : '';
  return `<div class="dz dz-today">${dzHead('today', t)}<div class="dzday"><div class="dzgrid">${timeGrid(from, to, blocks, { date: t, hl: true })}${memo}</div><div class="dzlist">${top}${list}<button class="dzu dzadd" data-a="quickNew" data-d="${t}">+ 할 일 추가</button></div></div></div>`;
}

/* ================= 9. 주간: 오늘을 가운데 둔 7일 10분 칸 시간표 ================= */
function vWeek() {
  const t = today();
  if (!wcenter) wcenter = t;
  if (!wsel || Math.abs(diffD(wcenter, wsel)) > 3) wsel = wcenter;
  const days = [-3, -2, -1, 0, 1, 2, 3].map(k => addD(wcenter, k));
  // 날마다 시간표 블록 (기상 전·취침 뒤는 옅은 빗금)
  const frames = days.map(frameItems);
  frames.forEach((F, k) => { if (k > 0) { const p = frames[k - 1], cut = p.s - 1440; if (cut > 0) F.list = F.list.filter(x => !(x.a < cut && x.a < F.w)); } });
  const from = Math.floor(Math.min(...frames.map(F => Math.min(F.w, ...F.list.map(x => x.a)))) / 60) * 60;
  const to = Math.ceil(Math.max(...frames.map(F => Math.max(F.s, ...F.list.map(x => x.b)))) / 60) * 60;
  const nm = days.includes(t) ? nowMin() : -1;
  let labels = '';
  for (let h = from / 60; h < to / 60; h++) labels += `<span class="${days.includes(t) && nm >= h * 60 && nm < h * 60 + 60 ? 'nowr' : ''}">${h % 24}</span>`;
  const heads = days.map(d => `<button class="wkhd${d === wcenter ? ' ctr' : ''}${d === t ? ' td' : ''}${wd(d) === 0 ? ' sun' : ''}" data-a="wkDay" data-d="${d}" aria-label="${esc(kd(d))}${d === t ? ', 오늘' : ''} 화면 열기" title="이 날 화면으로 가기"><span>${DOW[wd(d)]}</span><b>${+d.slice(8)}</b></button>`).join('');
  const alls = days.map(d => { const its = dayItems(d).filter(i => !i.time); return `<div class="wkall">${its.slice(0, 3).map(i => `<div class="ce${i.done ? ' done' : ''}" style="--c:${colorOf(i)};--f:${fillOf(i)}"><button class="cbx${i.done ? ' on' : ''}" data-a="tog" data-id="${esc(i.id)}" aria-pressed="${i.done}" aria-label="완료 표시: ${esc(i.title)}"></button><button class="cet" data-a="open" data-id="${esc(i.id)}" title="${esc(i.title)}">${esc(i.title)}</button></div>`).join('')}${its.length > 3 ? `<button class="cmore linkb" data-a="wkDay" data-d="${d}">+${its.length - 3}개</button>` : ''}</div>`; }).join('');
  const cols = days.map((d, k) => { const F = frames[k], bl = F.list.map(({ i, a, b }) => ({ a, b, c: colorOf(i), f: fillOf(i), label: i.title, id: i.id, cls: i.done ? 'done' : '' })); if (from < F.w) bl.unshift({ a: from, b: F.w, cls: 'off' }); if (F.s < to) bl.unshift({ a: F.s, b: to, cls: 'off' }); return timeGrid(from, to, bl, { date: d, nl: true }); }).join('');
  const range = `${+days[0].slice(5, 7)}월 ${+days[0].slice(8)}일 – ${days[6].slice(5, 7) !== days[0].slice(5, 7) ? +days[6].slice(5, 7) + '월 ' : ''}${+days[6].slice(8)}일`;
  let h = `<div class="card wkcard"><div class="row"><h2 style="margin:0" class="grow">${range}</h2><button class="ic" data-a="wk" data-n="-7" aria-label="일주일 전">${CHEV(-1)}${CHEV(-1).replace('<svg', '<svg style="margin-left:-12px"')}</button><button class="ic" data-a="wk" data-n="-1" aria-label="하루 전">${CHEV(-1)}</button><button class="mini" data-a="wkToday">오늘</button><button class="ic" data-a="wk" data-n="1" aria-label="하루 뒤">${CHEV(1)}</button><button class="ic" data-a="wk" data-n="7" aria-label="일주일 뒤">${CHEV(1)}${CHEV(1).replace('<svg', '<svg style="margin-left:-12px"')}</button></div>`
    + `<div class="wkwrap" data-c="${wcenter}"><div class="wkg"><span class="wkc"></span>${heads}<span class="wkc wkc2">종일</span>${alls}<div class="wkh">${labels}</div>${cols}</div></div>`
    + `<p class="mu" style="font-size:12.5px;margin:10px 2px 0">가운데가 ${wcenter === t ? '오늘' : esc(mdw(wcenter))}이에요. 칸을 끌거나 시작 칸·끝 칸을 차례로 누르면 그 날 그 시간으로 일정을 넣어요. 날짜를 누르면 그날 화면으로 가요. 빗금은 기상 전·취침 뒤예요.</p></div>`;
  const und = D.items.filter(i => !i.done && !i.g && !i.ad && i.date && i.date < t).sort((a, b) => a.date.localeCompare(b.date));
  if (und.length) h += `<div class="card"><h3>못 끝낸 일 ${und.length}개 <small>날짜를 누르면 그날로 옮겨요</small></h3>${und.map(i => `<div class="it" style="--c:${colorOf(i)}"><span class="cbar"></span><button class="ib" data-a="open" data-id="${esc(i.id)}"><span class="tm">${esc(mdw(i.date))}</span><span class="t">${esc(i.title)}</span></button><span class="row" style="gap:2px">${days.filter(d => d >= t).map(d => `<button style="padding:2px 7px;font-size:12px" data-a="assign" data-id="${esc(i.id)}" data-d="${d}">${DOW[wd(d)]} ${+d.slice(8)}</button>`).join('')}</span><button class="ic del" data-a="del" data-id="${esc(i.id)}" aria-label="삭제: ${esc(i.title)}">${TRASH}</button></div>`).join('')}</div>`;
  h += `<div class="card"><div class="row"><h3 class="grow" style="margin:0">고정 일정</h3><button data-a="newRule">＋ 고정 일정</button></div><div class="row" style="margin-top:8px">${D.rules.map(r => `<button class="lg${r.active ? '' : ' off'}" style="--c:${colorOf(r)};padding:3px 0" data-a="editRule" data-id="${esc(r.id)}"><i></i>${esc(r.title)} <small>${esc(ruleSum(r))}</small></button>`).join('') || '<small>매주 반복되는 일을 넣어 두면 자동으로 채워져요.</small>'}</div></div>`;
  const wk0 = mon(wcenter);
  h += `<div class="card"><h3>이번 주 메모 <small>${esc(md(wk0))} 주</small></h3><textarea data-wn="${wk0}" rows="3" placeholder="이번 주에 꼭 지킬 것, 컨디션, 다짐">${esc(D.weekNotes[wk0] || '')}</textarea></div>`;
  return h;
}
function centerWeek() {
  const w = document.querySelector('.wkwrap'); if (!w) return;
  const c = w.querySelector('.wkhd.ctr'), lab = w.querySelector('.wkh');
  if (!c || w.scrollWidth <= w.clientWidth) return;
  const lw = lab ? lab.offsetWidth : 0;
  w.scrollLeft = Math.max(0, c.offsetLeft - lw - (w.clientWidth - lw - c.offsetWidth) / 2);
}

/* ================= 9-1. 사진·표지 저장소 (IndexedDB) ================= */
// 사진 원본과 표지·책등 이미지는 용량이 커서 localStorage 대신 브라우저 안의 IndexedDB에 따로 보관해요.

  if ($('#m').open) { $('#m').returnValue = 'no'; $('#m').close(); }
  if (await ask(`'${b.title}' 삭제`, `책장에서 빼고, 기록한 구절 ${b.quotes.length}개도 함께 지워요.`, [['ok', '삭제', 'dg'], ['', '취소']]) !== 'ok') return;
  for (const v of [b.cover, b.spineImg]) if (String(v).startsWith('idb:')) forget(v.slice(4));
  D.books = D.books.filter(x => x !== b); save();
}

async function mediaExport() {
  const keys = await IDB.keys(), out = {};
  for (const k of keys) { const b = await IDB.get(k); if (!b) continue; out[k] = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); }); }
  download(`planner-media-${today()}.json`, JSON.stringify({ kind: 'planner-media', files: out }), 'application/json');
  toast(`사진·표지 ${keys.length}개를 내보냈어요`);
}
async function mediaImport(file) {
  if (!file) return;
  try {
    const o = JSON.parse(await file.text()); if (o.kind !== 'planner-media') throw 0;
    let n = 0; for (const [k, v] of Object.entries(o.files || {})) { const [h, d] = String(v).split(','), bin = atob(d || ''), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); await IDB.put(k, new Blob([u8], { type: (h.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream' })); n++; }
    URLS.clear(); render(); toast(`사진·표지 ${n}개를 가져왔어요`);
  } catch { toast('사진 백업 파일이 아닌 것 같아요', 'bad'); }
}
function openMore() {
  const m = $('#m');
  m.innerHTML = `<h3>더보기</h3><div class="moregrid">${MORE_TABS.map(([t, l]) => `<button class="${T === t ? 'on' : ''}" data-a="moreGo" data-t="${t}">${TAB_ICON[t]}<span>${l}</span></button>`).join('')}</div><div class="row end"><button data-a="mClose">닫기</button></div>`;
  m.onclose = null; m.returnValue = ''; m.showModal();
}

async function bookFile(kind, file) {
  if (!file || !bdraft) return;
  const url = URL.createObjectURL(file);
  try {
    const im = await loadImg(url), blob = await canvasBlob(im, kind === 'cover' ? 700 : 900, .88), key = (kind === 'cover' ? 'c:' : 's:') + bdraft.id + ':' + uid();
    await IDB.put(key, blob);
    if (kind === 'cover') { bdraft.cover = 'idb:' + key; const f = $('#m form.bookf'); if (f) f.elements.namedItem('cover').value = ''; refreshCover(); setDraftColor(bdraft.cover); }
    else { bdraft.spineImg = 'idb:' + key; const r = $('#m input[name=spine][value=photo]'); if (r) r.checked = true; toast('책등 사진을 넣었어요. 저장하면 책장에 보여요'); }
  } catch { toast('이미지를 열지 못했어요 (HEIC는 JPG로 바꿔 주세요)', 'bad'); }
  URL.revokeObjectURL(url);
}

function parseQuick(s) {
  let t = s.trim(), time = '', end = '', pri = '', m;
  if ((m = t.match(/^([ABC])\s+/))) { pri = m[1]; t = t.slice(m[0].length); }
  if ((m = t.match(/^(\d{1,2}):(\d{2})(?:\s*[-~]\s*(\d{1,2}):(\d{2}))?\s+/))) {
    time = `${m[1].padStart(2, '0')}:${m[2]}`; if (m[3]) end = `${m[3].padStart(2, '0')}:${m[4]}`; t = t.slice(m[0].length);
  } else if ((m = t.match(/^(오전|오후)?\s*(\d{1,2})시(?:\s*(\d{1,2})분|\s*반)?\s+/))) {
    let h = +m[2]; if (m[1] === '오후' && h < 12) h += 12; if (m[1] === '오전' && h === 12) h = 0;
    const mm = /반/.test(m[0]) ? 30 : +(m[3] || 0);
    if (h < 24 && mm < 60) { time = fromMin(h * 60 + mm); t = t.slice(m[0].length); }
  }
  if (time > '23:59') time = '';
  return { title: t || s.trim(), time, end, pri };
}

let drag = null, lastPT = '';
function slotsRange(a, b) { return [Math.min(a, b), Math.max(a, b) + 10]; }
function markSel(grid, a, b) { grid.querySelectorAll('.cell').forEach(c => { const s = +c.dataset.slot; c.classList.toggle('selc', s >= a && s < b); }); }
function finishPick(grid, a, b) {
  markSel(grid, -1, -1); $('#toast').className = '';
  const date = grid.dataset.date, nd = a >= 1440 ? addD(date, 1) : date;
  if (grid.closest('.dz')) return openQuick({ date: nd, time: fromMin(a), end: fromMin(b) });
  openItem(0, { date: nd, time: fromMin(a), end: fromMin(b) });
}
document.addEventListener('pointerdown', e => {
  lastPT = e.pointerType || '';
  const c = e.target.closest && e.target.closest('.tg:not(.ro) .cell'); if (!c) return;
  const grid = c.closest('.tg'), s = +c.dataset.slot;
  if (e.pointerType === 'mouse') { drag = { grid, a: s, b: s, moved: false }; markSel(grid, s, s + 10); e.preventDefault(); }
});
document.addEventListener('pointerover', e => {
  if (!drag) return; const c = e.target.closest && e.target.closest('.cell'); if (!c || c.closest('.tg') !== drag.grid) return;
  drag.b = +c.dataset.slot; drag.moved = drag.moved || drag.b !== drag.a; const [a, b] = slotsRange(drag.a, drag.b); markSel(drag.grid, a, b);
});
document.addEventListener('pointerup', () => {
  if (!drag) return; const d = drag; drag = null;
  if (d.moved) { const [a, b] = slotsRange(d.a, d.b); finishPick(d.grid, a, b); }
  else tapPick(d.grid, d.a);
});
document.addEventListener('click', e => {
  const c = e.target.closest && e.target.closest('.tg:not(.ro) .cell'); if (!c) return;
  // 마우스는 pointerup에서 이미 처리했어요. 아이폰 Safari의 click에는 pointerType이 없어서 바로 앞 pointerdown으로 판단해요.
  const pt = e.pointerType || lastPT; if (pt === 'mouse') return;
  tapPick(c.closest('.tg'), +c.dataset.slot);
});
function tapPick(grid, s) {
  if (grid.closest('.dz')) { pick = null; return finishPick(grid, s, s + 60); }
  if (pick && pick.grid === grid) { const [a, b] = slotsRange(pick.s, s); pick = null; finishPick(grid, a, b); return; }

function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
function ics() {
  const t = today(), lim = addD(t, 90), e8 = s => s.replace(/-/g, ''), stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const tx = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const fold = line => { const enc = new TextEncoder(); let out = '', cur = '', n = 0; for (const ch of line) { const b = enc.encode(ch).length; if (n + b > 73) { out += cur + '\r\n '; cur = ''; n = 1; } cur += ch; n += b; } return out + cur; };
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//goal-planner//KO', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:목표 플래너'];
  const ev = (uidv, date, time, end, title, memo, cat, rems, rrule) => {
    L.push('BEGIN:VEVENT', `UID:${uidv}@goal-planner`, `DTSTAMP:${stamp}`);
    if (time) { const en = end || addMin(time, 60), ed = toMin(en) <= toMin(time) ? addD(date, 1) : date; L.push(`DTSTART:${e8(date)}T${time.replace(':', '')}00`, `DTEND:${e8(ed)}T${en.replace(':', '')}00`); }
    else L.push(`DTSTART;VALUE=DATE:${e8(date)}`, `DTEND;VALUE=DATE:${e8(addD(date, 1))}`);
    if (rrule) L.push(rrule);
    L.push(`SUMMARY:${tx(title)}`);
    if (cat) L.push(`CATEGORIES:${tx(cat.name)}`);
    if (memo) L.push(`DESCRIPTION:${tx(memo)}`);
    for (const o of rems) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${tx(title)}`, `TRIGGER:-PT${o.minutes}M`, 'END:VALARM');
    L.push('END:VEVENT');
  };
  const its = D.items.filter(i => !i.g && !i.done && i.date && i.date >= t && i.date <= lim);
  for (const i of its) ev(i.id, i.date, i.time, i.end, i.title, i.memo, catOf(i.cat), remOverrides(i), '');
  const rs = D.rules.filter(r => r.active && r.days.length);
  for (const r of rs) { const b = ruleBody(r), d = ruleFirst(r), time = b.start.dateTime ? b.start.dateTime.slice(11, 16) : ''; ev('rule-' + r.id, d, time, b.end.dateTime ? b.end.dateTime.slice(11, 16) : '', r.title, r.memo, catOf(r.cat), b.reminders.overrides, ruleRRule(r, true)); }
  L.push('END:VCALENDAR');
  download(`planner-${t}.ics`, L.map(fold).join('\r\n') + '\r\n', 'text/calendar');
  toast(`일정 ${its.length}개와 고정 일정 ${rs.length}개를 .ics로 내려받았어요`);
}
